[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "fastapi>=0.138.2",
    "num2words>=0.5.14",
    "pillow>=11.0",
    "python-multipart>=0.0.32",
    "shapely>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# T201 bans bare `print`: everything the worker says must be a structured JSON
# line carrying the request's trace id, or it is invisible in Railway logs.
# Ruff's defaults (E4/E7/E9 + F) plus T201; the full "E" set would turn on
# E501 against 5 pre-existing long lines that `ruff format` does not rewrap,
# which is a reformatting job this task has no business doing.
select = ["E4", "E7", "E9", "F", "T201"]
