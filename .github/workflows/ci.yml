name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI-only dummy values — never real secrets. `apps/web`'s db client and
  # Better Auth config throw at import time if these are unset, and that
  # happens during `next build` (page-data collection), not just at
  # runtime, so they're needed job-wide.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/wyceny
  BETTER_AUTH_SECRET: ci-dummy-secret-not-a-real-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  WORKER_URL: http://localhost:8000

jobs:
  ci:
    runs-on: ubuntu-latest
    # 20: a healthy run is ~12 min, almost all of it the LibreOffice install.
    # The apt step now bounds itself (see below), so this is a backstop, not
    # the thing standing between a hung mirror and a wasted half hour.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wyceny
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyceny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (prettier)
        run: pnpm format:check

      # Belt-and-suspenders: the integration tests already call Drizzle's
      # `migrate()` in their own `beforeAll` (see apps/web/tests/*.test.ts),
      # which is idempotent and would apply the schema anyway. Running it
      # explicitly here fails the build fast, with a clear step name, if the
      # Postgres service or migrations are broken — instead of failing deep
      # inside `turbo run test`.
      - name: Apply Drizzle migrations
        working-directory: apps/web
        run: pnpm exec drizzle-kit migrate

      # --env-mode=loose: Turborepo's default *strict* env mode only passes
      # through env vars declared in turbo.json, which would silently drop
      # DATABASE_URL/BETTER_AUTH_*/WORKER_URL set above (confirmed locally:
      # without it, web:test fails with "DATABASE_URL is not set" even
      # though the job env clearly has it — local dev never hits this
      # because vitest/Next.js load `.env` directly via dotenv, which CI
      # has no equivalent of). No real secrets involved, so loose mode here
      # is safe.
      - name: Lint, typecheck, test, build (turbo)
        run: pnpm turbo lint typecheck test build --env-mode=loose

      - name: F-9 — no PII/secrets in VCS
        run: bash scripts/check-no-pii.sh

      - name: F-10 — dependency rule (dependency-cruiser)
        run: pnpm depcruise

      # The turbo step above already runs the lint and the test, so this does
      # NOT re-run them for coverage — it asserts the one thing nothing else
      # would notice: that the rule making the log wrapper mandatory is still
      # configured. Delete `no-console` and every existing test still passes
      # while a bare console.* can put an unfiltered payload into the log.
      - name: F-13 — no PII in logs (the allowlist gate is still wired)
        working-directory: apps/web
        run: |
          grep -q '"no-console": "error"' eslint.config.mjs || {
            echo "F-13: no-console is gone from eslint.config.mjs — the log allowlist can be bypassed"
            exit 1
          }

      # Catches the deployed migration ledger drifting from the repo's. Skips
      # itself when the secret is absent (forks), so it can never block an
      # outside contribution on something the contributor cannot see.
      #
      # `main` only, and that is load-bearing. Drift is a statement about the
      # deployed environment versus `main`; a feature branch that ADDS a
      # migration is not drift, it is the normal state of such a branch. Left
      # running on pull_request, the check fails whenever `applied < inRepo`
      # — and since migrations are applied only by the PRODUCTION build (the
      # `VERCEL_ENV` gate in migrate-on-deploy.mts deliberately keeps preview
      # builds off the database), nothing inside the PR could ever make it
      # pass. Every migration-bearing PR would be permanently red. Verified
      # the hard way on 2026-08-19: this PR adds 0012.
      - name: Migration drift vs deployed database
        if: github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm exec tsx scripts/check-migration-drift.mts

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Worker lint (ruff)
        working-directory: apps/worker
        run: uv run ruff check . && uv run ruff format --check .

      # The runner's default mirror (azure.archive.ubuntu.com) answered `Ign:`
      # to every index on 2026-08-19 and then went silent — apt hung for 21
      # minutes and took the whole job down with it, twice, at both a 15- and a
      # 25-minute limit. Two changes, both about failing fast rather than
      # waiting: point apt at the canonical mirror, and bound every apt call so
      # a bad mirror costs a minute instead of the entire run.
      #
      # The real fix is to stop installing a 400 MB office suite per run — a
      # prebuilt image or an apt cache — but that is a change to how CI is
      # built, not to this slice.
      - name: Ensure LibreOffice + Carlito (F-12 conversion tests)
        run: |
          set -euo pipefail
          if ! command -v soffice >/dev/null || ! fc-list | grep -qi carlito; then
            # The mirror lives in a MIRRORLIST, not in sources.list: apt's
            # first line is `Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist`.
            # Rewriting sources.list therefore changed nothing (verified on
            # run 32228351491 — azure kept answering `Ign:` afterwards). This
            # is the file that actually decides.
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
              /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            timeout 300 sudo apt-get update
          fi
          if ! command -v soffice >/dev/null; then
            timeout 900 sudo apt-get install -y --no-install-recommends libreoffice-writer
          fi
          if ! fc-list | grep -qi carlito; then
            timeout 300 sudo apt-get install -y fonts-crosextra-carlito
          fi
          soffice --version

      - name: Worker tests (F-5, F-11, F-12)
        working-directory: apps/worker
        run: uv run pytest -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    env:
      # NEXT_PUBLIC_* is inlined at `next build` time, so this must be set
      # before the "Build web" step below, not just at "Smoke E2E" — keeps
      # the address-blur EGiB/MPZP auto-fetch off so the e2e job stays
      # network-free (see subject-section.tsx's `onAddressBlur` guard).
      NEXT_PUBLIC_SUBJECT_AUTOFETCH: "off"
      # Same rationale, for the KW upload/extract flow: keeps the upload
      # buttons hidden so the manual-entry smoke path stays network-free
      # (see kw-section.tsx's `uploadEnabled` guard).
      NEXT_PUBLIC_KW_UPLOAD: "off"
      # Slice 9: approve fetches WMS maps via the worker; off keeps the e2e
      # smoke network-free (approve renders the honest §8.1 stub instead).
      MAPS_FETCH: "off"
      # Slice 10 (FR-2): keeps the inspection photo upload inputs hidden so
      # the smoke path stays network-free (see inspection-section.tsx's
      # `uploadEnabled` guard).
      NEXT_PUBLIC_PHOTO_UPLOAD: "off"
      # ADR-014 (FR-6): entering step 6 asks the worker (and an LLM behind it)
      # for the operat's prose. Off keeps the smoke network-free AND free of
      # charge, and renders the pre-FR-6 placeholder the spec walks through by
      # clicking "Dalej" (see step-descriptions.tsx). An UNSET variable means
      # ENABLED — staging/prod set it deliberately, this job must not.
      NEXT_PUBLIC_PROSE: "off"
      # Seeded login credentials. `scripts/seed-users.ts` has no default, so
      # the "Migrate + seed" step below aborts without these; the smoke spec
      # reads SEED_ADMIN_PASSWORD from here too, so the seeded password and
      # the one the smoke types can never drift apart. Job-level `env`
      # reaches both steps.
      #
      # Written in the clear on purpose: this Postgres is a throwaway service
      # container that lives and dies with the job — no real data, reachable
      # by nothing outside the runner. This value must NOT be reused anywhere
      # that outlives CI; staging/prod passwords live in the hosting
      # platform's env vars and never in this repo.
      SEED_ADMIN_PASSWORD: "ci-only-not-a-real-secret"
      SEED_APPRAISER_PASSWORD: "ci-only-not-a-real-secret"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wyceny
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wyceny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Migrate + seed
        working-directory: apps/web
        run: pnpm exec drizzle-kit migrate && pnpm seed
      - name: Ensure LibreOffice + Carlito (F-12 conversion tests)
        run: |
          if ! command -v soffice >/dev/null; then sudo apt-get update && sudo apt-get install -y libreoffice-writer; fi
          if ! fc-list | grep -qi carlito; then sudo apt-get install -y fonts-crosextra-carlito; fi
          soffice --version
      - name: Start worker
        working-directory: apps/worker
        run: |
          uv sync
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/worker.log 2>&1 &
      - name: Wait for worker
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail --silent http://localhost:8000/health || (cat /tmp/worker.log; exit 1)
      - name: Build web
        run: pnpm turbo build --filter=web --env-mode=loose
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke E2E
        working-directory: apps/web
        run: pnpm e2e
